<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prisma - Inicio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="home-page">
      <div class="home-container">
        <div class="sidebar">
          <div class="user-info">
            <div class="user-avatar">👤</div>
            <div class="user-greeting" id="userGreeting">Hola, María</div>
          </div>

          <div class="nav-menu">
            <div class="nav-item" onclick="window.location.href='profile.html'">
              Perfil
            </div>
            <div class="nav-item" onclick="window.location.href='match.html'">
              Matches
            </div>
          </div>

          <div class="sidebar-bottom">
            <div class="nav-item" onclick="logout()">Cerrar Sesión</div>
            <div class="nav-item">Política de Privacidad</div>
            <div class="nav-item">Soporte</div>
          </div>
        </div>

        <div class="main-content">
          <div class="top-bar">
            <div class="search-container">
              <div class="search-icon">🔍</div>
              <input
                type="text"
                class="search-input"
                placeholder="Buscar por..."
              />
            </div>
            <div class="top-icons">
              <button class="icon-btn">🔔</button>
            </div>
          </div>

          <div class="profile-container">
            <div class="profile-photo-box"></div>

            <div class="profile-info-box">
              <div class="profile-name">Luisa, 23</div>
              <div class="profile-details">
                Estudiante de Medicina<br />Medellín
              </div>

              <div class="section-title">Preferencias</div>
              <div class="section-content">
                Relación seria<br />
                Sin hijos<br />
                Residencia en Medellín
              </div>

              <div class="section-title">Gustos</div>
              <div class="section-content">
                Cocinar<br />
                Viajar<br />
                Música Clásica
              </div>
            </div>
          </div>

          <div class="action-buttons">
            <button class="action-btn btn-back">↶</button>
            <button class="action-btn btn-reject">✖</button>
            <button class="action-btn btn-like">💖</button>
            <button class="action-btn btn-info">ℹ</button>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
    <script>
      initializeHomePage();
    </script>
  </body>
</html>
