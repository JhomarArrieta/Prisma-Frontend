<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prisma - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="login-page">
      <div class="left-side">
        <div class="branding">
          <div class="logo-icon">🔮</div>
          <h1 class="app-name">Prisma</h1>
          <p class="slogan">Donde cada conexión revela tu verdadero color</p>
        </div>
      </div>

      <div class="divider"></div>

      <div class="right-side">
        <div class="auth-container">
          <div class="auth-header">
            <h2 class="auth-title">¡Bienvenido!</h2>
          </div>

          <div class="auth-tabs">
            <button class="tab-btn active" onclick="switchTab('login')">
              Iniciar Sesión
            </button>
            <button class="tab-btn" onclick="switchTab('register')">
              Registrarse
            </button>
          </div>

          <form id="authForm">
            <div class="form-group">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                required
                placeholder="tu@email.com"
              />
            </div>

            <div class="form-group">
              <label for="password">Contraseña</label>
              <input
                type="password"
                id="password"
                name="password"
                required
                placeholder="••••••••"
              />
            </div>

            <div class="additional-fields" id="additionalFields">
              <div class="form-group">
                <label for="name">Nombre Completo</label>
                <input
                  type="text"
                  id="name"
                  name="name"
                  placeholder="Tu nombre completo"
                />
              </div>

              <div class="form-group">
                <label for="age">Edad</label>
                <input
                  type="number"
                  id="age"
                  name="age"
                  min="18"
                  max="100"
                  placeholder="25"
                />
              </div>

              <div class="form-group">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <input
                  type="password"
                  id="confirmPassword"
                  name="confirmPassword"
                  placeholder="••••••••"
                />
              </div>
            </div>

            <button type="submit" class="form-btn" id="submitBtn">
              Iniciar Sesión
            </button>
          </form>

          <div class="forgot-password" id="forgotPassword">
            <a href="#" onclick="forgotPassword()">¿Olvidaste tu contraseña?</a>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
