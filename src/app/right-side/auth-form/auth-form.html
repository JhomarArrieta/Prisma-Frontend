<form id="authForm">
    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="tu@email.com">
    </div>

    <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">
    </div>

    <div class="additional-fields" id="additionalFields">
        <div class="form-group">
            <label for="name">Nombre Completo</label>
            <input type="text" id="name" name="name" placeholder="Tu nombre completo">
        </div>

        <div class="form-group">
            <label for="age">Edad</label>
            <input type="number" id="age" name="age" min="18" max="100" placeholder="25">
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirmar Contraseña</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••">
        </div>
    </div>

    <button type="submit" class="form-btn" id="submitBtn">
        Iniciar Sesión
    </button>
</form>
