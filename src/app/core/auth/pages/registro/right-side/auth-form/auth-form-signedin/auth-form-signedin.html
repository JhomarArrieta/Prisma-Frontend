<form>
    <div class="additional-fields" id="additionalFields">
        <div class="form-group">
            <label for="name">Nombres</label>
            <input type="text" id="name" name="name" placeholder="Tu nombre completo">
        </div>

        <div class="form-group">
            <label for="lastname">Apellidos</label>
            <input type="text" id="lastname" name="lastname" placeholder="Tus apellidos">
        </div>

        <div class="form-group">
            <label for="birthdate">Fecha de nacimiento</label>
            <input type="date" id="birthdate" name="birthdate" required>
        </div>

        <div class="form-group">
            <label for="city">Ciudad</label>
            <select id="opciones">
                @for (opcion of listaOpciones; track $index) {
                    <option [value]="opcion">{{ opcion }}</option>
                }
            </select>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="tu@email.com">
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirmar Contraseña</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••">
        </div>

         <button type="submit" class="form-btn" id="submitBtn">
            Crear cuenta
        </button>

    </div>
</form>
