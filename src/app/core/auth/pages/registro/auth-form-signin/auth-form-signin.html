<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="additional-fields" id="additionalFields">
        <div class="form-group">
            <label for="name">Primer nombre *</label>
            <input type="text" id="name" formControlName="primer_nombre" placeholder="Tu primer nombre" required>
        </div>

        <div class="form-group">
            <label for="name">Segundo nombre</label>
            <input type="text" id="second_name" formControlName="segundo_nombre" placeholder="Tu segundo nombre">
        </div>

        <div class="form-group">
            <label for="lastname">Primer apellido *</label>
            <input type="text" id="lastname" formControlName="primer_apellido" placeholder="Tu primer apellido" required>
        </div>

        <div class="form-group">
            <label for="lastname">Segundo apellido</label>
            <input type="text" id="second_lastname" formControlName="segundo_apellido" placeholder="Tu segundo apellido">
        </div>

        <div class="form-group">
            <label for="birthdate">Fecha de nacimiento *</label>
            <input type="date" id="birthdate" formControlName="fecha_nacimiento" required>
        </div>

        <div class="form-group">
            <label for="city">Ciudad de residencia *</label>
            <select id="opciones" formControlName="ubicacion" required>
                @for (opcion of listaOpciones; track $index) {
                    <option [value]="opcion">{{ opcion }}</option>
                }
            </select>
        </div>

        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" formControlName="email" required placeholder="tu@email.com">
        </div>

        <div class="form-group">
            <label for="password">Contraseña *</label>
            <input type="password" id="password" formControlName="contrasena" required placeholder="••••••••">
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirmar Contraseña *</label>
            <input type="password" id="confirmPassword" placeholder="••••••••" required>
        </div>

         <button type="submit" class="form-btn" id="submitBtn">
            Crear cuenta
        </button>

    </div>
</form>
